<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="50%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>

    <!-- Outer Bezel Metal Gradient -->
    <linearGradient id="bezelMetal" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="25%" stop-color="#bec8d2"/>
      <stop offset="50%" stop-color="#eaf0f6"/>
      <stop offset="75%" stop-color="#7a8796"/>
      <stop offset="100%" stop-color="#3e4752"/>
    </linearGradient>

    <!-- Titanium Chisel Gradient -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Electric Orange Jet Thrust Gradient -->
    <linearGradient id="jetOrange" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ff9944"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#cc3300"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="jetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Beveled Shield Rim -->
  <polygon points="50,4 85,16 85,42 50,96 15,42 15,16" 
           fill="url(#bezelMetal)"/>

  <!-- Inner Dark Carbon Shield Plate -->
  <polygon points="50,8 81,19 81,41 50,91 19,41 19,19" 
           fill="url(#crestBg)"/>

  <!-- Glowing Orange Energy Border Halo -->
  <polygon points="50,11 77,21 77,40 50,86 23,40 23,21" 
           fill="none" 
           stroke="url(#jetOrange)" 
           stroke-width="1.8" 
           opacity="0.9" 
           filter="url(#jetGlow)"/>

  <!-- Inner Sub-border -->
  <polygon points="50,13 75,22 75,39 50,83 25,39 25,22" 
           fill="none" 
           stroke="#0f141c" 
           stroke-width="1.2"/>

  <!-- Aerodynamic 'R' Emblem Anatomy -->
  <!-- Base Orange Jet Ambient Glow behind the letter R -->
  <path d="M30 26 L66 26 C73 26 77 30 75 37 C73 44 67 47 58 47 L45 47 L65 71 L53 71 L36 49 L33 49 L30 71 L24 71 L30 26 Z" 
        fill="url(#jetOrange)" 
        opacity="0.45" 
        filter="url(#jetGlow)"/>

  <!-- Left Vertical Stem / Hydrofoil Strut -->
  <polygon points="31,27 38,27 33,69 26,69" 
           fill="url(#titanium)"/>
  <polygon points="31,27 34,27 30,69 27,69" 
           fill="#ffffff" 
           opacity="0.6"/>

  <!-- Top Curved Aerodynamic Loop (Upper Chine) -->
  <path d="M37 27 L64 27 C70.5 27 74 31 72 36.5 C70.2 41.5 64.5 45 56 45 L35 45 Z" 
        fill="url(#titanium)"/>

  <!-- Internal Orange Horizon Line in the Loop -->
  <path d="M41 32 L58 32 C62 32 63.5 34 62.5 36.5 C61.5 39 58.5 40 55 40 L40 40 Z" 
        fill="#070a0e"/>
  <line x1="42" y1="36" x2="57" y2="36" stroke="url(#jetOrange)" stroke-width="1.5" filter="url(#jetGlow)"/>

  <!-- Forward-Carving Slalom Leg (Hydrofoil Wedge) -->
  <polygon points="43,45 56,45 70,69 60,69 48,51 39,51" 
           fill="url(#titanium)"/>
  <polygon points="49,46 54,46 68,69 64,69" 
           fill="url(#jetOrange)" 
           filter="url(#jetGlow)"/>
  <polygon points="43,45 46,45 60,69 57,69" 
           fill="#ffffff" 
           opacity="0.7"/>

  <!-- Micro Technical Compass Crosses & Precision Dot -->
  <circle cx="50" cy="80" r="2" fill="url(#jetOrange)" filter="url(#jetGlow)"/>
</svg>
