<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="logoBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Titanium Metal Gradient -->
    <linearGradient id="logoMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0e8f0"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Electric Orange Jet Thrust Gradient -->
    <linearGradient id="logoOrange" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ff9944"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#d63a00"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Precision Marine Crest Icon (x: 2 to 54) -->
  <g transform="translate(4, 3) scale(0.54)">
    <!-- Outer Beveled Shield -->
    <polygon points="50,4 85,16 85,42 50,96 15,42 15,16" fill="url(#logoMetal)"/>
    <polygon points="50,8 81,19 81,41 50,91 19,41 19,19" fill="url(#logoBadgeBg)"/>
    <!-- Orange Halo -->
    <polygon points="50,11 77,21 77,40 50,86 23,40 23,21" fill="none" stroke="url(#logoOrange)" stroke-width="2.5" opacity="0.9" filter="url(#logoGlow)"/>

    <!-- 'R' Anatomy -->
    <polygon points="31,27 38,27 33,69 26,69" fill="url(#logoMetal)"/>
    <polygon points="31,27 34,27 30,69 27,69" fill="#ffffff" opacity="0.7"/>

    <path d="M37 27 L64 27 C70.5 27 74 31 72 36.5 C70.2 41.5 64.5 45 56 45 L35 45 Z" fill="url(#logoMetal)"/>
    <path d="M41 32 L58 32 C62 32 63.5 34 62.5 36.5 C61.5 39 58.5 40 55 40 L40 40 Z" fill="#070a0e"/>
    <line x1="42" y1="36" x2="57" y2="36" stroke="url(#logoOrange)" stroke-width="2" filter="url(#logoGlow)"/>

    <polygon points="43,45 56,45 70,69 60,69 48,51 39,51" fill="url(#logoMetal)"/>
    <polygon points="49,46 54,46 68,69 64,69" fill="url(#logoOrange)" filter="url(#logoGlow)"/>

    <circle cx="50" cy="80" r="3" fill="url(#logoOrange)" filter="url(#logoGlow)"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="66" y1="12" x2="66" y2="48" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>

  <!-- Right: Luxury Typography "RUVO" -->
  <text x="80" y="36" 
        font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#f8fafc">RUVO</text>
  
  <!-- Glowing Orange Dot next to RUVO -->
  <circle cx="218" cy="27" r="3.2" fill="url(#logoOrange)" filter="url(#logoGlow)"/>

  <!-- Sub-descriptor: ELECTRIC WATERCRAFT • INDIA -->
  <text x="81" y="49" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="7.5" 
        font-weight="600" 
        letter-spacing="2.8" 
        fill="#94a3b8">ELECTRIC WATERCRAFT • INDIA</text>
</svg>
