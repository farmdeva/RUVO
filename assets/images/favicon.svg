<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1015"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Chrome / Titanium Metal Gradient -->
    <linearGradient id="chromeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e6ebf0"/>
      <stop offset="50%" stop-color="#9aa4b0"/>
      <stop offset="70%" stop-color="#d8e0e8"/>
      <stop offset="100%" stop-color="#707c8a"/>
    </linearGradient>

    <!-- Electric Orange Jet Glow Gradient -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ff8c37"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#d63a00"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aa4b0"/>
      <stop offset="35%" stop-color="#ff6a00"/>
      <stop offset="70%" stop-color="#ff3e00"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Nautical Shield / Crest -->
  <path d="M32 3 L54 11 C54 26 49 45 32 60 C15 45 10 26 10 11 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#shieldRim)" 
        stroke-width="1.8"/>

  <!-- Inner Orange Halo Contour -->
  <path d="M32 6.5 L50.5 13.5 C50.5 26.5 46.2 43 32 55.5 C17.8 43 13.5 26.5 13.5 13.5 Z" 
        fill="none" 
        stroke="url(#orangeGlow)" 
        stroke-width="0.9" 
        opacity="0.85"
        filter="url(#glow)"/>

  <!-- Stylized Aerodynamic RUVO 'R' Monogram -->
  <!-- Back / Vertical Stem Wing -->
  <path d="M21 18 L28 18 L24 44 L19 44 L21 28 Z" fill="url(#chromeGrad)"/>
  
  <!-- Orange Speed Core Inset behind Upper Wing -->
  <path d="M25 21 L41 21 C45 21 47.5 24 46 28 C44.5 32 41 34 36 34 L29 34 Z" 
        fill="url(#orangeGlow)" 
        filter="url(#glow)" 
        opacity="0.95"/>

  <!-- Titanium Upper Bow Wing -->
  <path d="M27 19.5 L40.5 19.5 C44 19.5 45.8 22 44.5 25.5 C43.2 29 39.8 31 35.5 31 L26 31 Z" 
        fill="url(#chromeGrad)"/>

  <!-- Inner Negative Space Slit -->
  <path d="M28.5 23 L37 23 C38.8 23 39.5 24.2 39 25.8 C38.5 27.2 37 28 35.2 28 L27.8 28 Z" 
        fill="#080c10"/>

  <!-- Dynamic Hydro-Jet Carving Lower Leg (Forward Prow) -->
  <path d="M29 31 L37.5 31 L47 44 L39.5 44 L32.5 35 L27.5 35 Z" 
        fill="url(#chromeGrad)"/>

  <!-- Electric Orange Hydrofoil Accent Spike -->
  <path d="M31.5 33 L42 44 L45 44 L34.5 33 Z" 
        fill="url(#orangeGlow)"/>

  <!-- Center Focal Light Dot -->
  <circle cx="32" cy="51" r="1.3" fill="#ff6a00" filter="url(#glow)"/>
</svg>
